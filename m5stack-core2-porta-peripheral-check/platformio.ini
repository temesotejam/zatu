; M5Stack Core2 Port A peripheral checker
[env:m5stack-core2]
platform = espressif32@6.7.0
board = m5stack-core2
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags =
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
lib_deps =
  m5stack/M5Unified
  sparkfun/SparkFun VL53L5CX Arduino Library
